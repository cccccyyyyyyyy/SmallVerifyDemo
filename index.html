<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0;
  }
  .card {
    text-align: center; padding: 56px 64px; border-radius: 20px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  h1 { margin: 0 0 12px; font-size: 44px; letter-spacing: -1px; }
  p  { margin: 0; color: #94a3b8; font-size: 15px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, World 👋</h1>
    <p><span class="dot"></span>SmallVerifyDemo · 部署验证页</p>
  </div>
</body>
</html>
